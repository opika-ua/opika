services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    # The image's default CMD is just ["postgres"] (verified), so these flags replace nothing.
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60s", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: opika
      POSTGRES_PASSWORD: opika
      POSTGRES_DB: opika
    ports:
      - "${OPIKA_DB_PORT:-5433}:5432"
    volumes:
      - opika-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opika -d opika"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opika-db-data:
