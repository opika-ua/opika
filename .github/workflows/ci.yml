name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Avoid Corepack's interactive "about to download" confirmation prompt,
  # which has no reliable non-interactive bypass on some Corepack versions
  # (see CLAUDE.md). `corepack install` below activates the pinned package
  # manager explicitly before it's ever invoked lazily.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: opika
          POSTGRES_PASSWORD: opika
          POSTGRES_DB: opika_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U opika -d opika_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      # v7 — GitHub deprecated the Node 20 Actions runner in Sep 2025;
      # anything older than actions/checkout@v5 targets that runtime and
      # is not guaranteed to run on current hosted runners.
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pinned package manager
        run: corepack install

      # v6 — same Node-20-runner deprecation applies to setup-node; v6 is
      # current as of this workflow and targets the node24 runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      # DO NOT REMOVE. `tsc` resolves `./x.js` to `./x.ts` under every
      # moduleResolution mode, so a relative import carrying a `.js` extension
      # typechecks perfectly clean and then fails in the bundler, which looks
      # for a literal `x.js` on disk. That is precisely how /discovery reached
      # main with a green CI while being unbuildable. Typecheck structurally
      # cannot catch this class; only a real `next build` can.
      #
      # The harness below also builds the app, which makes this step look
      # redundant. It is not: this one fails in seconds with a compiler error,
      # and it keeps working if the harness is ever quarantined or broken.
      - name: Build web
        run: pnpm run build:web

      # ~170MB and unchanged between runs of the same Playwright version, so
      # key the cache on the lockfile — a version bump busts it.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @opika/web exec playwright install --with-deps chromium

      # DO NOT REMOVE. The gate for the browser layer: real layout geometry and
      # real pointer events against /discovery at 390x844 and 1280x800. Every
      # assertion in it corresponds to a defect that shipped through a green CI
      # because the check applied was "the text is in the HTML".
      #
      # One desktop assertion is marked `test.fail()` on purpose — the layout is
      # phone-only and that gap is recorded rather than hidden. See the TODO in
      # test/harness/discovery-layout.harness.ts.
      - name: Rendering harness
        run: pnpm run test:harness

      # Failure screenshots and traces. Without these a red harness run in CI
      # is just a number, and the first instinct is to re-run it.
      - name: Upload harness artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-failures
          path: apps/web/test-results/
          retention-days: 7
