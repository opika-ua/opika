# Weekly, grouped, with a cooldown that mirrors pnpm's 24h minimumReleaseAge (docs/dev-notes.md).
# Dependabot only opens PRs: they run CI and go through the merge queue like any other. Nothing
# auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    ignore:
      # Runtime is pinned to Node 24 LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Planned upgrade: postgres.js 4 PR plus a smoke sitting after launch.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Planned upgrade: one PR, both packages, after launch.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Biome patches too can add lint diagnostics and change formatting (2.5.6 -> 2.5.15 fails lint).
      # Upgrade by hand in its own PR: run lint:fix and review the diff.
      - dependency-name: "@biomejs/biome"
    groups:
      # Kept together for when majors are allowed again.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      # One PR for every Actions update, majors included.
      github-actions:
        patterns:
          - "*"
